name: deploy

on:
  pull_request:
    paths: ["envs/**", "modules/**", "app/**"]
  push:
    branches: [main]
    paths: ["envs/**", "modules/**", "app/**"]

permissions:
  id-token: write # OIDC to AWS
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_DIR: envs/dev

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"
      - name: Format check and validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform fmt -check -recursive ../..
          terraform validate
      - name: Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false -var="image_tag=${{ github.sha }}"

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      # The ECR repo must exist before the image can be pushed, and the image
      # must exist before the ECS service can start. Hence the two-step apply.
      - name: Ensure ECR repo exists
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.app

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/noc-dev-app"
          docker build -t "$REPO:${{ github.sha }}" --build-arg APP_VERSION=${{ github.sha }} app/
          docker push "$REPO:${{ github.sha }}"

      - name: Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve -var="image_tag=${{ github.sha }}"

      - name: Smoke test
        working-directory: ${{ env.TF_DIR }}
        run: |
          URL=$(terraform output -raw app_url)
          for i in $(seq 1 20); do
            if curl -fsS "$URL/health"; then echo; echo "healthy"; exit 0; fi
            sleep 15
          done
          echo "service did not become healthy" && exit 1
